name: Migrations

# Drift check: reconstruye la BD desde cero con supabase/migrations/ en un
# Postgres efímero del runner. NO usa secrets ni se conecta a ningún proyecto
# remoto (prod incluido) — solo Docker local.
#
# Antes de levantar la BD, supabase/ci/prepare-rebuild.sh verifica que ninguna
# migración aplicada en prod cambió (supabase/ci/applied-migrations.sha256),
# agrega el bootstrap previo a la primera migración y neutraliza, solo en el
# runner, la sentencia 42P17 de 20260523231651_public_booking.sql. Al aplicar
# una migración nueva en prod, agrega su sha256 al manifiesto.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-reset:
    name: db-reset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Prepare migrations (hash check + bootstrap + 42P17 patch)
        run: bash supabase/ci/prepare-rebuild.sh

      # db start levanta solo el contenedor de Postgres (sin auth/storage/etc.)
      # y ya aplica las migraciones sobre un contenedor nuevo.
      - name: Start local Postgres
        run: supabase db start

      - name: supabase db reset
        run: supabase db reset --local

      - name: Verify every migration was applied
        run: |
          ls supabase/migrations/*.sql | sed 's#.*/##; s/_.*//' | sort > /tmp/expected.txt
          docker exec supabase_db_baw-os psql -U postgres -Atc \
            "select version from supabase_migrations.schema_migrations order by 1" > /tmp/applied.txt
          echo "Migration files: $(wc -l < /tmp/expected.txt) · applied: $(wc -l < /tmp/applied.txt)"
          if ! diff /tmp/expected.txt /tmp/applied.txt; then
            echo "::error::Las versiones aplicadas no coinciden con los archivos de supabase/migrations"
            exit 1
          fi

      - name: Stop
        if: always()
        run: supabase stop --no-backup
